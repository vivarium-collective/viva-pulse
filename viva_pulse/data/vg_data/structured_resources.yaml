name: structured_resources
version: '1'
description: >
  Provenance of the physiology viva-pulse wraps. viva-pulse drives the real
  Kitware Pulse Physiology Engine, which is Kitware's open-source continuation
  of the DARPA/SBIR BioGears engine — both are lumped-parameter, circuit-analog
  whole-body models with feedback-ODE control. The cards below describe the
  engines and the baroreflex control loop the hemorrhage studies rest on; each
  cross-links to the primary references folded into the References list.

resources:

# ── Model-provenance cards (rendered section) ───────────────────────────────
- id: engine-pulse
  type: physiology-model
  name: Pulse Physiology Engine (the engine viva-pulse wraps)
  summary: >
    The real, open-source Kitware Pulse whole-body adult engine. Individual
    systems (cardiovascular, respiratory, renal, tissue, thermal, energy,
    environment, drug) are lumped-parameter circuit analogs coupled by
    differential equations for feedback, pharmacokinetics/pharmacodynamics and
    diffusion, advanced in real time. C++ with Python/Java/C#/C bindings.
  what_viva_pulse_uses: >
    viva-pulse wraps this engine as process-bigraph Processes (PulseProcess,
    PulseCircuitProcess). Every number in the studies comes from advancing this
    engine; there is no surrogate.
  validation: >
    Pulse ships a verification & validation suite covering resting physiology
    and 100+ disease, trauma and treatment scenarios.
  homepage: https://pulse.kitware.com
  role_in_investigation: >
    The substrate of the whole pulse-hemorrhage investigation — the hemorrhage,
    resuscitation controller and all 21 patient states run on it.
  references:
  - ref-bray2019pulse
  - ref-webb2022ventilator

- id: engine-biogears
  type: physiology-model
  name: BioGears (Pulse's origin engine)
  summary: >
    The open-source whole-body human physiology engine (originally a DARPA /
    TATRC program) that Kitware forked and continued as Pulse. Shares the
    lumped-parameter circuit-analog architecture and the PK/PD framework, and
    documents many of the system models and validation studies Pulse inherits.
  relation_to_pulse: >
    Pulse is Kitware's open-source continuation of BioGears; the cardiovascular,
    respiratory, renal and energy system models and their baroreflex/chemoreflex
    control loops trace back to the BioGears methodology.
  homepage: https://www.biogearsengine.com
  role_in_investigation: >
    Background provenance for the system models and the baroreflex the studies
    rely on; not run directly by viva-pulse.
  references:
  - ref-baird2020biogears
  - ref-mcdaniel2019sepsis
  - ref-mcdaniel2019pkpd

- id: control-baroreflex
  type: physiology-model
  name: Baroreflex cardiovascular control (the hemorrhage mechanism)
  summary: >
    The short-term arterial-pressure control loop: a fall in mean arterial
    pressure raises heart rate and vascular tone to defend perfusion. In the
    BioGears/Pulse lineage this is an explicit feedback model integrated into
    the whole-body cardiovascular circuit.
  role_in_investigation: >
    This is the emergent mechanism the hemorrhage-severity-sweep study reports
    (finding F-04): tachycardia defends MAP for mild bleeds and is outrun once
    cardiac output falls. The reference grounds that mechanism in the engine's
    own model rather than in outside literature.
  references:
  - ref-clipp2016baroreflex
  - ref-bray2019pulse

