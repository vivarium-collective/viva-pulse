  statement: Pressure is defended by baroreflex tachycardia, not by reduced loss.
    Heart rate rises monotonically with severity (71 -> 110 /min) while cardiac output
    still falls (5.75 -> 3.95 L/min); MAP is held only while the tachycardia offsets
    the volume loss and breaks once the bleed outruns it (severity >= 0.6). The compensation
    is Pulse's own cardiovascular reflex, not an imposed term.
  evidence:
    study_tests:
    - tests/test_severity.py::test_heart_rate_rises_with_severity
    - tests/test_severity.py::test_pressure_falls_for_severe_bleeds
    runs: 'canonical runs: investigation run of 2026-10-25 at commit b4332d6 (runs.db)'
conclusion: '## Claims

  The hypothesis holds on all six criteria (7/7 tests passed). The criteria were fixed
  before the canonical runs but after a pilot that included severity 0.2 and 0.8;
  the unseen points (0.4, 0.6, 1.0) fall where the hypothesis predicts.


  ## Limitations

  One patient, one site and 10 minutes. MAP is recorded once a second, so dips within
  a heartbeat are not seen. At that resolution no sample at severity 0.2 or 0.4 leaves
  a 2 mmHg band around the start (largest deviations 1.13 and 1.78 mmHg); severity
  0.6, 0.8 and 1.0 first leave it at 416, 447 and 366 s.

  '
