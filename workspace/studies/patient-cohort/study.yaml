units_and_time:
- quantity: time
  unit: s
  scale: 1 s per recorded row (PulseProcess interval 1.0)
  note: Pulse's own clock; its internal solver step is 0.02 s.
- quantity: pressures (MAP)
  unit: mmHg
  note: As reported by Pulse.
- quantity: heart rate
  unit: 1/min
  note: As reported by Pulse.
- quantity: volumes (blood volume, hemorrhaged volume)
  unit: mL
  note: As reported by Pulse.
- quantity: cardiac output
  unit: L/min
  note: As reported by Pulse.
- quantity: infusion rate
  unit: mL/min
  note: Commanded by the MAP controller.
expected_behavior:
- name: every-patient-compensates
  observable: vitals.blood_volume_mL, vitals.heart_rate_bpm, vitals.mean_arterial_pressure_mmHg
  condition: in all 21 patients blood volume and MAP fall and heart rate rises
  test: tests/test_cohort.py::test_every_patient_bleeds_and_compensates
- name: smaller-patients-lose-larger-fraction
  observable: vitals.total_hemorrhaged_volume_mL / initial vitals.blood_volume_mL
  condition: Spearman rank correlation with starting blood volume <= -0.7
  test: tests/test_cohort.py::test_smaller_patients_lose_a_larger_fraction
