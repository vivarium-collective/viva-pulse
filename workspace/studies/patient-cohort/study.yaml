last_test_run:
  timestamp: '2026-10-23T10:25:21+00:00'
  passed: 23
  failed: 0
  skipped: 0
  duration_s: 0.46565699577331543
claim: 'All 21 shipped patients bleed and compensate the same way, and the fraction
  of blood lost falls with starting blood volume (Spearman rho = -0.91).

  '
confidence: Accepted
findings:
- id: F-01
  tier: observation
  statement: In every patient blood volume and MAP fell and heart rate rose. MAP fell
    by 3.8 mmHg (Bradycardic) to 32.2 mmHg (Joel); heart rate rose by 21.5 (Bradycardic)
    to 48.9 per min (Rick). No patient reached an irreversible state.
  evidence:
    study_tests:
    - tests/test_cohort.py::test_every_patient_bleeds_and_compensates
    runs: 'canonical runs: investigation run of 2026-10-23 at commit 5754940 (runs.db)'
- id: F-02
  tier: observation
  statement: Absolute loss ranged from 1094 mL (ExtremeFemale) to 1755 mL (ExtremeMale),
    a much narrower spread than starting blood volume (2881 to 7072 mL), so the fraction
    lost ranged from 23.8% (Overweight) to 38.1% (Underweight); its Spearman rank
    correlation with starting blood volume is -0.91.
  evidence:
    study_tests:
    - tests/test_cohort.py::test_smaller_patients_lose_a_larger_fraction
    runs: 'canonical runs: investigation run of 2026-10-23 at commit 5754940 (runs.db)'
- id: F-03
  tier: mechanism
  mechanism_origin: emergent
  statement: The fraction-volume trend follows from a shared compensation, not from
    different responses per patient. Every patient runs Pulse's same baroreflex (F-01),
    and the absolute loss is much less variable (1094-1755 mL) than the starting volume
    (2881-7072 mL); because a similar absolute loss is taken from very different
    reserves, the fraction lost falls as starting volume rises (rho = -0.91). The
    uniform mechanism, not patient-specific physiology, produces the correlation.
  evidence:
    study_tests:
    - tests/test_cohort.py::test_every_patient_bleeds_and_compensates
    - tests/test_cohort.py::test_smaller_patients_lose_a_larger_fraction
    runs: 'canonical runs: investigation run of 2026-10-23 at commit 5754940 (runs.db)'
alternative_hypotheses:
- hypothesis: The fraction-volume correlation is driven by one or two outlier patients.
  status: excluded
  evidence: The correlation is Spearman (rank-based) over all 21 patients, rho = -0.91,
    which is not set by a single extreme value.
- hypothesis: Larger patients lose a larger fraction, or there is no relationship.
  status: excluded
  evidence: The rank correlation is strongly negative (-0.91); smaller patients lose
    the larger fraction (F-02).
- hypothesis: Some patients do not compensate (a qualitatively different response).
  status: excluded
  evidence: F-01 — all 21 patients bled, lost volume and raised heart rate, and none
    reached an irreversible state.
discovery_implications:
  resolved: Across Pulse's 21 shipped patients the bleed-and-compensate response is
    qualitatively uniform, and the fraction lost falls with starting blood volume.
  remaining: Whether this holds for a real population rather than Pulse's shipped
    examples, and whether one severity means the same bleeding rate across body sizes.
  followup_study_proposals:
  - title: cohort-no-bleed-control
    motivation: Run the no-bleed arm for all 21 patients so the negative control is
      cohort-wide rather than borrowed from the StandardMale sibling run.
  - title: severity-calibrated-to-flow
    motivation: Map Pulse severity to a per-patient flow rate so equal severity means
      equal bleeding rate, isolating body size from bleed rate.
conclusion: '## Claims

  The hypothesis holds (23/23 tests passed).


  ## Limitations

  The shipped patients are examples, not a population, and the same severity is not
  the same bleeding rate in every patient.

  '
