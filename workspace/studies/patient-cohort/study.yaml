robustness:
  n_replicates: 1
  parameter_sweep: true
  note: Pulse is deterministic; the cohort is a sweep over the patient state file.
preregistered:
  registered_at: '2026-10-23'
  criteria:
  - tests/test_cohort.py::test_every_shipped_patient_ran
  - tests/test_cohort.py::test_every_patient_bleeds_and_compensates
  - tests/test_cohort.py::test_smaller_patients_lose_a_larger_fraction
  predictions:
  - 'Pilot probe (direct pulse_hemorrhage runs, 600 s): all 21 states load; fraction
    lost ranges 23.8% (Overweight) to 38.1% (Underweight); Spearman rank correlation
    of fraction lost with starting blood volume is -0.91.'
  thresholds_provenance: The -0.7 correlation threshold is set below that pilot value;
    the qualitative criteria follow from the hypothesis.
  pilot: Criteria were written after a direct pilot of the same 21 configurations
    (workspace/experiments/_runs.yaml, pilot-2026-10-23-patients), which gave Spearman
    rho = -0.91. Pulse is deterministic, so these criteria are regression checks on
    the canonical runs, not out-of-sample predictions.
falsifiability: 'Refuted if any patient fails to load or run, if any patient''s blood
  volume,

  heart rate or MAP moves the other way, or if the rank correlation of fraction

  lost with starting blood volume is above -0.7.

  '
limitations:
- The 21 patients are Pulse's shipped examples, not a population sample.
- The same severity number does not mean the same bleeding rate in every patient.
- The negative control is established on a cohort member in the sibling study rather
  than re-run for all 21 patients; a cohort-wide no-bleed sweep is a proposed follow-up.
- Acceptance rests on the deterministic pilot, not external literature (none was provided),
  so the bands are regression checks, not a population validation.
controls:
- name: no-bleed
  kind: negative
  hypothesis: With no hemorrhage a patient loses no blood and vitals stay at their
    loaded values, confirming the cohort's loss and compensation come from the bleed
    and not from loading the state.
  expected: Under 1 mL lost; MAP and heart rate within 1 unit of their start.
  observed: "Established on this engine for StandardMale (a cohort member) in the\
    \ sibling hemorrhage-severity-sweep study, severity-0.0 arm \u2014 0 mL lost,\
    \ MAP 95.3 -> 95.3, heart rate 72.0 -> 71.2. A cohort-wide no-bleed sweep is a\
    \ proposed follow-up."
  result: PASS
- name: ExtremeFemale
  kind: positive
  hypothesis: The smallest-volume patient, the extreme of the predictor, shows the
    bleed-and-compensate response and sits at the high-fraction end of the trend.
  expected: A clear bleed with compensation, and one of the largest fractions lost.
  observed: 1094 mL lost on a 2915 mL starting volume (~37.5%), near the top of the
    fraction range; blood volume and MAP fell and heart rate rose.
  result: PASS
