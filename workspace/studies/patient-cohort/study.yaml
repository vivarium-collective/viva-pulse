- name: cohort-blood-loss
  address: local:CohortBloodLoss
  config:
    inputs_map:
      blood_volume: vitals.blood_volume_mL
      hemorrhaged_volume: vitals.total_hemorrhaged_volume_mL
      mean_arterial_pressure: vitals.mean_arterial_pressure_mmHg
