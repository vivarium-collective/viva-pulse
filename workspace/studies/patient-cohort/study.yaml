schema_version: 4
name: patient-cohort
title: Hemorrhage across the shipped patients
investigation: pulse-hemorrhage
created: '2026-10-23'
status: complete
execution_status: completed
verdict: supported
gate_status: passed
phase: Decide
question: 'Does the same right-leg hemorrhage (severity 0.8, 10 minutes) produce the

  same qualitative response in all 21 patients that ship with Pulse, and how

  does the fraction of blood lost depend on the patient''s starting blood volume?

  '
hypothesis: 'Every patient loses blood volume, raises heart rate and loses arterial
  pressure. Absolute blood loss varies much less than starting blood volume does,
  so patients with a smaller starting blood volume lose a larger fraction of it.

  '
objective: 'Run pulse_hemorrhage (RightLeg, severity 0.8, 600 s) once from each of
  the 21

  stabilized states in Pulse''s install (bin/states/*@0s.json) and compare the

  final vitals and the fraction of blood lost.

  '
baseline:
- name: StandardMale
  composite: viva_pulse.composites.hemorrhage.pulse_hemorrhage
  params:
    state_file: StandardMale@0s.json
    compartment: RightLeg
    severity: 0.8
    n_steps: 600
