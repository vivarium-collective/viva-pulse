claim: 'Both treated arms end with more blood volume (+78 mL) and a higher MAP (+2.2 mmHg) than the untreated arm, but saline and whole blood are indistinguishable over 10 minutes.

  '
confidence: Accepted
findings:
- id: F-01
  tier: observation
  statement: 'Untreated: blood volume 3935.8 mL, MAP 84.08 mmHg. Saline: 4014.07 mL, 86.33 mmHg. Whole blood: 4014.07 mL, 86.33 mmHg.'
  evidence:
    study_tests:
    - tests/test_resuscitation.py::test_treated_arms_preserve_blood_volume
    - tests/test_resuscitation.py::test_treated_arms_preserve_pressure
    runs: 'canonical runs: investigation run of 2026-10-23 at commit 5754940 (runs.db)'
- id: F-02
  tier: observation
  statement: The controller first infused at t = 508 s, when MAP fell below its 90 mmHg target, and delivered 79.6 mL in each treated arm (the rate recorded at t applies over the following second). Saline and whole blood differ by 0.002 mL of blood volume and 0.0006 mmHg of MAP at 10 min; Pulse's own serialized state confirms the Blood arm infused compound Blood.
  evidence:
    study_tests:
    - tests/test_resuscitation.py::test_controller_engages_in_treated_arms
    runs: 'canonical runs: investigation run of 2026-10-23 at commit 5754940 (runs.db)'
- id: F-03
  tier: mechanism
  mechanism_origin: engineered
  statement: The improvement is produced by the engineered MapFluidController, not by the fluid itself. The loop watches MAP and commands infusion only once it falls below the 90 mmHg target, so the intervention is late (t=508 s) and small (79.6 mL); the restored volume, not the compound, drives the +78 mL / +2.2 mmHg gain. This is an engineered control term added to the composite, distinct from Pulse's own reflexes.
  evidence:
    study_tests:
    - tests/test_resuscitation.py::test_controller_engages_in_treated_arms
    - tests/test_resuscitation.py::test_treated_arms_preserve_blood_volume
    runs: 'canonical runs: investigation run of 2026-10-23 at commit 5754940 (runs.db)'
alternative_hypotheses:
- hypothesis: The arms look alike only because the controller never actually infuses.
  status: excluded
  evidence: F-02/F-03 — the controller engaged at t=508 s and delivered 79.6 mL in each treated arm; the treated arms beat untreated by +78 mL and +2.2 mmHg.
- hypothesis: The treated-vs-untreated gap is within run-to-run variation.
  status: excluded
  evidence: Pulse is deterministic (single replicate justified); the untreated arm reproduces the reference run exactly, so the +78 mL / +2.2 mmHg gap is not noise.
- hypothesis: Whole blood should outperform saline within this 10-minute window.
  status: untested
  evidence: The two compounds differ by 0.002 mL and 0.0006 mmHg at 10 min — below any resolution — because only 79.6 mL was infused. The window is too short to separate them; this is the compound-comparison follow-up, not a null result.
conclusion: '## Claims

  The hypothesis holds (7/7 tests passed): treatment preserves blood volume and MAP.


  ## Limitations

  With a 90 mmHg target the controller only engages in the last 92 s and infuses 79.6 mL, too little to separate saline from whole blood. Comparing compounds needs a longer run or an earlier-engaging controller (higher target or gain).

  '
discovery_implications:
  followup_study_proposals:
  - id: compound-comparison
    title: Saline vs whole blood over a longer resuscitation
    motivation: In 10 minutes the controller infused only 79.6 mL, so the compounds could not be told apart; run 30-60 min, or sweep the MAP target, to see whether whole blood holds pressure better.
