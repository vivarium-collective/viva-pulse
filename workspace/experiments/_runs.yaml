# Recorded simulation runs (cross-phase, cross-model). Append-only.
runs:
- id: pilot-2026-10-23-severity
  model: viva_pulse.composites.hemorrhage.pulse_hemorrhage
  phase: post-initial-wrapping Task 1 (pilot for hemorrhage-severity-sweep)
  parameters: {state_file: StandardMale@0s.json, compartment: RightLeg, severity: [0.2, 0.5, 0.8], duration_s: 600}
  command: uv run --no-sync python workspace/experiments/pilot-2026-10-23/probe_studies.py severity 0.2 0.5 0.8
  outputs: [workspace/experiments/pilot-2026-10-23/severity_600s.jsonl]
  timestamp: '2026-10-23'
  note: >-
    Run directly (not through the workbench) before the studies' criteria were written.
    Severity 0.2 and 0.8 are also canonical grid points, and Pulse is deterministic, so
    those criteria were fixed knowing the outcome; 0.0, 0.4, 0.6 and 1.0 were unseen.
- id: pilot-2026-10-23-patients
  model: viva_pulse.composites.hemorrhage.pulse_hemorrhage
  phase: post-initial-wrapping Task 1 (pilot for patient-cohort)
  parameters: {state_file: all 21 bin/states/*@0s.json, compartment: RightLeg, severity: 0.8, duration_s: 600}
  command: uv run --no-sync python workspace/experiments/pilot-2026-10-23/probe_studies.py patients 600
  outputs: [workspace/experiments/pilot-2026-10-23/patients_600s.jsonl]
  timestamp: '2026-10-23'
  note: >-
    The same configurations as the canonical cohort runs. It showed that all 21 states load
    and gave the Spearman rho of -0.91 from which the cohort's -0.7 threshold was set.
- id: circuit-access-2026-10-24
  model: Pulse HumanAdultWholeBody (direct, not a composite); HumanAdultHemodynamics for hemo
  phase: post-initial-wrapping item 7 scoping (plan-whats-missing-I Phase 1, probes P-a to P-e)
  parameters: {state_file: StandardMale@0s.json, modes: [reads, virtual, points, edit, modifier, add, remove, patient, hemo]}
  command: for m in reads virtual points edit modifier add remove patient hemo; do uv run --no-sync python workspace/experiments/circuit-access-2026-10-24/probe_circuit_access.py $m; done
  outputs: [workspace/experiments/circuit-access-2026-10-24/probes.jsonl]
  timestamp: '2026-10-24'
  note: >-
    Read and interpreted in docs/plan/plan-circuit-level-access.md. Wall times are from an
    Apple M3 Max (16 cores); remove and hemo run in a child process because they segfault
    (exit -11).
- id: path-additions-2026-10-25
  model: Pulse HumanAdultWholeBody (direct, not a composite)
  phase: circuit-level access candidate 4 (path additions), the link and transport probe
  parameters: {state_file: StandardMale@0s.json, path: Aorta1 -> VenaCava1, resistance_mmHg_s_per_mL: 0.5, arms: [unedited, path_only, path_link, path_link_cv], samples_s: [0, 10, 30, 60]}
  command: PYTHONPATH=$PWD uv run --no-sync python workspace/experiments/path-additions-2026-10-25/probe_path_additions.py
  outputs: [workspace/experiments/path-additions-2026-10-25/probes.jsonl]
  timestamp: '2026-10-25'
  note: >-
    Read and interpreted in docs/plan/plan-circuit-level-access.md section 3. Deterministic;
    path_link and path_link_cv agree in every sampled value.
