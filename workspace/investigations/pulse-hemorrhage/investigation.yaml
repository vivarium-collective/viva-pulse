  what_is_this: Three workbench studies of hemorrhage in the real Pulse whole-body engine.
  verdict: All criteria passed (38/38 study tests) on the canonical runs. The criteria were fixed before those runs, from pilots that overlapped them (workspace/experiments/_runs.yaml), except two severity checks added on 2026-10-26 after the runs (every-sample MAP band), which are regression checks.
  verdict_status: passed
  verdict_detail: 'Severity: loss and heart rate rise with severity; MAP holds to severity 0.4, then falls. Resuscitation: treatment preserves blood volume and MAP; saline and whole blood add the same volume by Pulse''s construction, so volume and MAP barely differ (about 1e-5 after 500 mL). Cohort: every shipped patient compensates; smaller patients lose a larger fraction (rho = -0.91).'
