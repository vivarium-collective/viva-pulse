[build-system]
requires = ["hatchling>=1.27"]  # PEP 639 license expression
build-backend = "hatchling.build"

[project]
name = "viva-pulse"
version = "0.7.0"
description = "Process-bigraph wrapper for the Kitware Pulse Physiology Engine"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{name = "Alex Patrie", email = "alexanderpatrie@gmail.com"}]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
# Pulse itself is not on PyPI: build it from source (see README.md) and point
# PULSE_INSTALL_DIR at the install prefix. These are the runtime deps of
# Pulse's own Python API; protobuf must match the Pulse build (7.35.x).
dependencies = [
    "bigraph-schema>=1.8.3",
    "process-bigraph>=1.10.1",
    "numpy",
    "pandas",
    "platformdirs",  # cache directory for stabilized patient states
    "protobuf",
    "bigraph-viz>=2.0.3",
    "pyyaml>=6.0",
    "jsonschema[format-nongpl]>=4.21",
    "jinja2>=3.1",
    "pypdf>=4.0",
    "matplotlib",
    "plotly",
    "vivarium-workbench",
]

[project.optional-dependencies]
dev = ["pytest", "plotly", "bigraph-viz"]

# The user documentation (`make docs`); its tutorials run the real engine, so it
# builds in this project's venv: `uv pip install --group docs`.
[dependency-groups]
docs = [
    "furo>=2025.12.19",
    "ipykernel>=7.4.0",
    "myst-nb>=1.4.0",
    "sphinx>=8.2",  # 9.x needs Python 3.12; requires-python admits 3.11
]

# The workbench runs studies in this project's own venv (it is the only one
# that can import PyPulse), so it is pinned to the main commit installed there.
[tool.uv.sources]
vivarium-workbench = { git = "https://github.com/vivarium-collective/vivarium-workbench.git", rev = "d484974c" }

[tool.hatch.build.targets.wheel]
packages = ["viva_pulse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
