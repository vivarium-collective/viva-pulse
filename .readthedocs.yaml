# Read the Docs build of the user documentation (https://viva-pulse.readthedocs.io).
# Pulse can't be built here (15-minute build cap), so documentation/conf.py publishes the
# tutorials as code only when READTHEDOCS is set; every other page builds as it does locally.
# Read the Docs installs with uv so [tool.uv.sources] (the pinned workbench commit) applies.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

python:
  install:
    - method: uv
      command: sync
      groups:
        - docs
      extras:
        - workbench  # the results page reads runs.db through the workbench

sphinx:
  configuration: documentation/conf.py
  fail_on_warning: true
